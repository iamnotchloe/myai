name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q src tests evaluation
      - name: Lint
        run: ruff check src tests evaluation
      - name: Test
        run: pytest -q
